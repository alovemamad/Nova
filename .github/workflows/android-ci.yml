name: Nova VPN Android CI & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version (e.g. 1.0.2). Leave empty to auto-bump from version.properties"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-and-build-debug:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Nova VPN unit tests (Phone & TV)
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace
          ./gradlew :app:testDebugUnitTest -PtvBuild=true --stacktrace

      - name: Build Debug APKs (Phone & TV)
        run: |
          mkdir -p ci-debug-apks/phone ci-debug-apks/tv
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk ci-debug-apks/phone/
          rm -rf app/build/outputs/apk
          ./gradlew :app:assembleDebug -PtvBuild=true --stacktrace
          cp app/build/outputs/apk/debug/*.apk ci-debug-apks/tv/

      - name: Upload Debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-vpn-debug-apk
          path: ci-debug-apks/**/*.apk

  publish-github-release:
    needs: test-and-build-debug
    runs-on: ubuntu-latest
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    env:
      GH_TOKEN: ${{ github.token }}
      # --- اصلاحات مربوط به کلید امضا ---
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve Release Version & Tag
        id: ver
        run: |
          set -euo pipefail
          source app/version.properties
          CUR_CODE="${VERSION_CODE:-2}"
          CUR_NAME="${VERSION_NAME:-1.0.1}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TARGET_NAME="${GITHUB_REF_NAME#v}"
            TAG="v${TARGET_NAME}"
            NEXT_CODE="${CUR_CODE}"
          elif [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            TARGET_NAME="${{ github.event.inputs.release_version }}"
            TARGET_NAME="${TARGET_NAME#v}"
            TAG="v${TARGET_NAME}"
            NEXT_CODE="$((CUR_CODE + 1))"
          else
            TAG="v${CUR_NAME}"
            TARGET_NAME="${CUR_NAME}"
            NEXT_CODE="${CUR_CODE}"
            while gh release view "${TAG}" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; do
              NEXT_CODE="$((NEXT_CODE + 1))"
              IFS='.' read -r MAJ MIN PAT <<< "${TARGET_NAME}"
              PAT="$(( ${PAT:-0} + 1 ))"
              TARGET_NAME="${MAJ}.${MIN}.${PAT}"
              TAG="v${TARGET_NAME}"
            done
          fi

          cat > app/version.properties <<EOF
          VERSION_CODE=${NEXT_CODE}
          VERSION_NAME=${TARGET_NAME}
          EOF

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${TARGET_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEXT_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release ${TAG} (code ${NEXT_CODE})"

      - name: Ensure Native Core Binaries
        run: |
          if [[ ! -f app/src/main/jniLibs/arm64-v8a/libaether.so || ! -f app/libs/hev-socks5-tunnel.aar ]]; then
            chmod +x scripts/build-native.sh
            ./scripts/build-native.sh
          fi

      # Optional: enable to compile sing-box libbox.aar (gVisor TUN) from upstream source
      # - name: Build Optional sing-box libbox.aar
      #   run: |
      #     chmod +x scripts/build-libbox.sh
      #     ./scripts/build-libbox.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Multi-ABI Phone & TV APKs (arm64-v8a, armeabi-v7a, x86_64, universal)
        id: build_apks
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.ver.outputs.tag }}"
          shopt -s nullglob

          copy_split_apks() {
            local apk_dir="$1"
            local prefix="$2"
            local variant="$3"
            for apk in "${apk_dir}"/*.apk; do
              base="$(basename "$apk")"
              if [[ "$prefix" == "NovaVPN-TV" ]]; then
                case "$base" in
                  *arm64-v8a*)   cp "$apk" "dist/${prefix}-${TAG}-a64.apk" ;;
                  *armeabi-v7a*) cp "$apk" "dist/${prefix}-${TAG}-a32.apk" ;;
                  *x86_64*)      cp "$apk" "dist/${prefix}-${TAG}-intel.apk" ;;
                  *universal*)   cp "$apk" "dist/${prefix}-${TAG}-all.apk" ;;
                  *)             cp "$apk" "dist/${prefix}-${TAG}-${variant}.apk" ;;
                esac
              else
                case "$base" in
                  *arm64-v8a*)   cp "$apk" "dist/${prefix}-${TAG}-arm64-v8a.apk" ;;
                  *armeabi-v7a*) cp "$apk" "dist/${prefix}-${TAG}-armeabi-v7a.apk" ;;
                  *x86_64*)      cp "$apk" "dist/${prefix}-${TAG}-x86_64.apk" ;;
                  *universal*)   cp "$apk" "dist/${prefix}-${TAG}-universal.apk" ;;
                  *)             cp "$apk" "dist/${prefix}-${TAG}-${variant}.apk" ;;
                esac
              fi
            done
          }

          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" && -n "${KEY_PASSWORD}" && -n "${KEY_ALIAS}" ]]; then
            # اصلاح: نام فایل به پسوند p12 تغییر کرد
            echo "${KEYSTORE_BASE64}" | base64 --decode > release-key.p12

            # Phone split APKs
            ./gradlew :app:assembleRelease -PsplitApks=true \
              -Pandroid.injected.signing.store.file="${PWD}/release-key.p12" \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
              --stacktrace
            copy_split_apks "app/build/outputs/apk/release" "NovaVPN" "release"

            # Clean APK outputs before TV build so artifacts cannot collide
            rm -rf app/build/outputs/apk

            # Android TV split APKs (same signing certificate & version)
            ./gradlew :app:assembleRelease -PsplitApks=true -PtvBuild=true \
              -Pandroid.injected.signing.store.file="${PWD}/release-key.p12" \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
              --stacktrace
            copy_split_apks "app/build/outputs/apk/release" "NovaVPN-TV" "release"

            rm -f release-key.p12
          else
            if [[ -f debug.keystore.base64 && ! -f debug.keystore ]]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            fi

            ./gradlew :app:assembleDebug -PsplitApks=true --stacktrace
            copy_split_apks "app/build/outputs/apk/debug" "NovaVPN" "debug"

            rm -rf app/build/outputs/apk

            ./gradlew :app:assembleDebug -PsplitApks=true -PtvBuild=true --stacktrace
            copy_split_apks "app/build/outputs/apk/debug" "NovaVPN-TV" "debug"
          fi

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Commit updated version.properties (best-effort)
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet app/version.properties; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/version.properties
            git commit -m "chore(release): bump version to ${{ steps.ver.outputs.tag }} [skip ci]" || true
            git push || true
          fi

      - name: Create GitHub Release with Phone & TV ABI APKs
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "${TAG}" dist/*.apk dist/SHA256SUMS.txt \
              --title "Nova VPN ${TAG}" \
              --notes "Android TV: download NovaVPN-TV-${TAG}-a64.apk (most TV boxes), -a32.apk (older boxes), or -all.apk (universal)." \
              --generate-notes \
              --latest
          fi
