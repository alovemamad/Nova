name: Nova VPN Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Nova VPN unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.novavpn.*" --stacktrace

      - name: Build Debug APK (no secrets required)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-release-signed:
    needs: test-and-build-debug
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Signed Release APK (when keystore secrets are present)
        id: build_release
        run: |
          if [[ -n "${KEYSTORE_BASE64}" && -n "${STORE_PASSWORD}" && -n "${KEY_PASSWORD}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="${PWD}/my-upload-key.jks"
            ./gradlew :app:assembleRelease --stacktrace
            rm -f my-upload-key.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keystore secrets not configured; skipping signed release build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Signed Release APK
        if: steps.build_release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-vpn-release-apk
          path: app/build/outputs/apk/release/*.apk
